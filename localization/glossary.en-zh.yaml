schema_version: "1.2"
document_status: active_governance
policy_ref: localization/translation-policy.md
source_locale: en-US
target_locale: zh-CN
last_updated: "2026-08-07"

philosophy: "English canonical term + optional Chinese support."

status_values:
  - draft
  - reviewed
  - approved
  - rejected

display_modes:
  - english_only
  - limited_bilingual
  - localized_ui
  - product_name_review
  - source_original

field_semantics:
  term_english: "Canonical source of truth."
  term_chinese: "Optional compact support label; never overrides English or implies runtime approval."
  term_aliases: "Search discovery only unless separately approved."
  term_explanation: "Optional; use only to resolve governance ambiguity, never to teach the concept."

governance_rules:
  - "Every entry begins as draft; only human review may set approved."
  - "Professional magic and cognitive-science terms default to english_only."
  - "A Chinese value or alias does not authorize Chinese display."
  - "Unapproved product names fall back to English."
  - "Aliases never resolve entity identity."

