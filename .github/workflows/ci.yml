name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: magicforge_ci
          POSTGRES_USER: magicforge
          POSTGRES_PASSWORD: magicforge-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magicforge -d magicforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
    env:
      TEST_DATABASE_URL: postgresql+psycopg://magicforge:magicforge-ci-only@127.0.0.1:5432/magicforge_ci
      TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: npm ci
        working-directory: frontend
      - name: Wait for Qdrant
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:6333/collections >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: python -m compileall -q app analysis knowledge llm persistence research retrieval security
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://magicforge:magicforge-ci-only@127.0.0.1:5432/magicforge_ci
      - run: pytest -q
      - name: Refuse skipped service integrations
        run: pytest -q tests/test_database_migrations.py tests/test_qdrant_server_integration.py -W error::pytest.PytestUnhandledThreadExceptionWarning

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:security
      - run: npm run build

  release-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - run: python scripts/audit_public_release.py --source .
      - run: python scripts/build_public_release.py --output dist/magicforge-public.zip
      - run: unzip -q dist/magicforge-public.zip -d dist/extracted
      - run: python scripts/audit_public_release.py --source dist/extracted/magicforge-public
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose --profile demo config --quiet
      - run: docker build --file Dockerfile.backend --tag magicforge-backend:ci .
      - run: docker build --file frontend/Dockerfile --tag magicforge-frontend:ci .

  demo-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, release-safety]
    steps:
      - uses: actions/checkout@v4
      - name: Start clean synthetic Demo
        run: ./magicforge up demo
      - name: Run Demo Doctor
        run: ./magicforge doctor demo
      - name: Verify public HTTP surfaces
        run: python -m scripts.ops.full_stack_smoke --web-url http://127.0.0.1:3000
      - name: Stop Demo
        if: always()
        run: ./magicforge down demo --volumes --confirm delete-demo-volumes

  public-artifact-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, release-safety]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Build & extract the allowlist-only source artifact
        run: |
          python scripts/build_public_release.py --output dist/magicforge-public.zip
          unzip -q dist/magicforge-public.zip -d dist/clean-room
      - name: Start the clean-room synthetic Demo
        working-directory: dist/clean-room/magicforge-public
        run: ./magicforge up demo
      - name: Verify the clean-room Demo
        working-directory: dist/clean-room/magicforge-public
        run: ./magicforge doctor demo
      - name: Stop the clean-room Demo
        if: always()
        working-directory: dist/clean-room/magicforge-public
        run: ./magicforge down demo --volumes --confirm delete-demo-volumes
